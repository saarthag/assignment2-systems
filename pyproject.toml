[project]
name = "cs336-systems"
version = "26.1.4"
description = "CS336 Assignment 2 - Systems"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs336-basics",
    "humanfriendly",
    "matplotlib",
    "numpy",
    "pytest>=8",
    "regex>=2026.3.32",
    "torch~=2.11.0",
    "tqdm>=4.67.1",
    "wandb>=0.19.7",
    "pandas>=2",
    "ty>=0.0.29",
    "ruff>=0.17.0",
    "pydantic>=2.13.1",
    "humanize>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cs336_systems"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"

[tool.uv.sources]
cs336-basics = { git = "https://github.com/saarthag/assignment1-basics.git", rev = "main" }



[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit.*",
    "ignore:Attempting to run cuBLAS:UserWarning",
    "ignore:TensorFloat32:UserWarning",
]

[tool.ruff]
line-length = 180

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[dependency-groups]
dashboard = [
    "fastapi>=0.142.2",
    "plotly>=7.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]
